# 需求追溯矩陣（RTM）通用 schema 範例 — 完整註解版
# 用途：kit --rtm 安裝時的 scaffold 參考；建檔流程見 kit/references/rtm-authoring.md。
#
# ── 雙讀者設計（CRITICAL）─────────────────────────────────────────
#   detail_specs ＝ 給「人」（承辦人／客戶／驗收者）的正式文書描述——零程式細節。
#   impl_details ＝ 給「機器」（Claude）的 code 定位錨點——`路徑 → 符號` 格式，
#                  讓行為定位變 O(1)（口語 → grep matrix → 直達檔案，不全庫摸索）。
#   兩欄不可互相混寫：detail_specs 出現檔案路徑＝寫錯欄；impl_details 寫散文＝寫錯欄。
#
# ── 欄位正名與向下相容 ───────────────────────────────────────────
#   正名：req_id / req_text（requirement，通用——需求來源不限 RFP）。
#   向下相容別名：rfp_id / rfp_text——rtm-check 以 `req_id ?? rfp_id` normalize，
#   既有 matrix（如 dfaa）不需改名。新專案一律用 req_id / req_text。
#
# ── status enum（預設值，可由 .claude/kit/kit.yaml 的 status_enum 覆寫）──
#   implemented ＝ 已實作且與需求一致
#   partial     ＝ 部分實作（notes 說明缺口）
#   divergent   ＝ 實作與需求有意識地不一致（notes 必填：為何偏離、誰裁定）
#   planned     ＝ 尚未實作（此 status 免填 impl_details——尚無實作可定位；
#                  detail_specs 寫規劃中的行為即可）
#   na          ＝ 不適用（notes 說明理由）
#
# ── 必填規則 ─────────────────────────────────────────────────────
#   每條目：req_id、req_text、status、detail_specs 必填。
#   impl_details：status ≠ planned 時必填；planned 免填（有可參照的既有機制仍可填）。
#   notes：status ∈ {divergent, na} 時必填，其餘選填。
#   額外欄（impl_routes、verify 等）：passthrough——rtm-check 不驗不擋，專案自由擴充。
#
# ── 維運鐵則 ─────────────────────────────────────────────────────
#   增刪條目必須同步 meta.total_clauses（機器閘門 rtm-check 會對帳）。
#   改行為必須同 commit 更新對應條目（pre-commit require-requirements-sync 會擋，
#   但主動做而不是被 gate 教育）。

meta:
  # section：本檔涵蓋的需求章節（一個章節一檔；切檔粒度見 rtm-authoring.md 判斷題）
  section: 系統功能需求/範例章節
  # total_clauses：本檔條目總數（rtm-check 對帳錨點）
  total_clauses: 3

entries:
# ── 範例 1：implemented 完整條目 ──
- req_id: 系統功能需求/範例章節/1
  req_text: 使用者登入後可於儀表板檢視自己負責的工作項清單。
  status: implemented
  detail_specs:
  - 使用者以帳號密碼登入後進入儀表板，儀表板中央顯示「我的工作項」清單，依最近異動時間排序。
  - 清單每列顯示工作項名稱、狀態與截止日；點選任一列進入該工作項詳情頁。
  impl_routes:            # 額外欄範例（passthrough）：使用者可及的入口路徑
  - 儀表板（/dashboard）
  impl_details:
  - '清單元件: src/components/dashboard/my-tasks-list.tsx'
  - 'API: src/server/api/tasks.ts → listMine（依 updatedAt desc）'
  - 'Model: Task(schema.prisma, assigneeId FK)'

# ── 範例 2：planned 條目（免 impl_details）──
- req_id: 系統功能需求/範例章節/2
  req_text: 工作項逾期時系統應以電子郵件通知負責人。
  status: planned
  detail_specs:
  - 逾期通知功能規劃中；現行僅於儀表板以紅色標記逾期工作項，無主動通知。
  notes: 待通知頻率與收件範圍訪談確認後實作；可沿用既有 mailer 基礎設施。

# ── 範例 3：divergent 條目（notes 必填）──
- req_id: 系統功能需求/範例章節/3
  req_text: 工作項刪除後應保留於資源回收桶三十日。
  status: divergent
  detail_specs:
  - 本系統採軟刪除：刪除之工作項自清單隱藏，可由管理者還原，無三十日自動清除排程。
  impl_details:
  - '軟刪除: src/server/api/tasks.ts → softDelete（deletedAt 標記）'
  - '還原入口: src/app/admin/trash/page.tsx'
  notes: 需求方同意以「無限期保留＋管理者還原」取代三十日自動清除（會議紀錄 2026-01-15）；若日後要求自動清除再補排程。
